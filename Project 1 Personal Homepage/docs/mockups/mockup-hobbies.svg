<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 710" font-family="Arial, sans-serif" font-size="14">
  <rect width="800" height="710" fill="#FFF9F0"/>

  <!-- header -->
  <rect x="0" y="0" width="800" height="56" fill="#FFF9F0" stroke="#EADCCB"/>
  <text x="50" y="33" font-weight="bold" fill="#3E3A36">Jiaying Guo</text>
  <text x="560" y="33" fill="#75695E">Home</text>
  <text x="614" y="33" fill="#3E3A36" text-decoration="underline">Hobbies</text>
  <text x="680" y="33" fill="#75695E">Kitchen</text>
  <circle cx="755" cy="28" r="13" fill="none" stroke="#A67C52"/>

  <text x="50" y="120" font-size="32" font-weight="bold" fill="#3E3A36">Life Outside Code</text>
  <rect x="50" y="140" width="380" height="9" rx="4" fill="#E7DCCD"/>

  <line x1="0" y1="190" x2="800" y2="190" stroke="#EADCCB"/>
  <text x="50" y="230" font-size="20" font-weight="bold" fill="#3E3A36">Games I Love</text>
  <text x="50" y="252" fill="#75695E">Click a cover to flip the card.</text>

  <!-- three flip cards: front = cover image, back = description -->
  <rect x="50" y="270" width="220" height="165" rx="20" fill="#E7DCCD"/>
  <text x="160" y="350" text-anchor="middle" fill="#75695E">Game cover image</text>
  <text x="160" y="370" text-anchor="middle" fill="#75695E" font-size="12">(front)</text>

  <rect x="290" y="270" width="220" height="165" rx="20" fill="#E7DCCD"/>
  <text x="400" y="350" text-anchor="middle" fill="#75695E">Game cover image</text>

  <rect x="530" y="270" width="220" height="165" rx="20" fill="#FFFFFF" stroke="#EADCCB"/>
  <text x="550" y="310" font-weight="bold" fill="#3E3A36">Game title</text>
  <text x="550" y="330" font-size="12" fill="#A67C52">Studio, year</text>
  <rect x="550" y="345" width="180" height="8" rx="4" fill="#E7DCCD"/>
  <rect x="550" y="361" width="170" height="8" rx="4" fill="#E7DCCD"/>
  <rect x="550" y="377" width="150" height="8" rx="4" fill="#E7DCCD"/>
  <text x="640" y="420" text-anchor="middle" font-size="12" fill="#75695E">(back, after click)</text>
  <path d="M470 455 q60 30 120 0" fill="none" stroke="#A67C52" stroke-width="2"/>
  <text x="530" y="490" text-anchor="middle" font-size="12" fill="#86613D">click to flip ↻</text>

  <text x="50" y="520" fill="#75695E">My wish list keeps growing...</text>

  <line x1="0" y1="550" x2="800" y2="550" stroke="#EADCCB"/>
  <text x="50" y="590" font-size="20" font-weight="bold" fill="#3E3A36">Other Things I Enjoy</text>
  <text x="50" y="612" fill="#75695E" font-size="12">Scroll right to see more →</text>
  <g fill="#FFFFFF" stroke="#EADCCB">
    <rect x="50" y="622" width="150" height="66" rx="20"/>
    <rect x="215" y="622" width="150" height="66" rx="20"/>
    <rect x="380" y="622" width="150" height="66" rx="20"/>
    <rect x="545" y="622" width="150" height="66" rx="20"/>
    <rect x="710" y="622" width="150" height="66" rx="20"/>
  </g>
  <g text-anchor="middle" fill="#3E3A36">
    <text x="125" y="660">🏸 Badminton</text>
    <text x="290" y="660">🎹 Piano</text>
    <text x="455" y="660">🍳 Cooking</text>
    <text x="620" y="660">🏓 Ping Pong</text>
    <text x="785" y="660">🧗 …</text>
  </g>
</svg>
